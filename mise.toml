[tools]
go = "1.27"
node = "22"

[env]
GOEXPERIMENT = "simd"

[tasks.dev]
description = "Run Wails v3 desktop dev mode"
run = "wails3 task dev"

[tasks.build]
description = "Build desktop binary"
run = "wails3 task build"

[tasks."ios:run"]
description = "Run on iOS simulator"
run = "wails3 task ios:run"

[tasks."android:run"]
description = "Run on Android emulator/device"
run = "wails3 task android:run"

[tasks.test]
description = "Run Go tests"
run = "go test -tags wgpu24 ./..."

[tasks.clear]
description = "Remove build artifacts"
run = "rm -rf bin/ dist/ build/bin/"

[tasks.release-mac]
description = "Build, sign, and notarize macOS Universal release"
run = "./scripts/release-mac.sh"
